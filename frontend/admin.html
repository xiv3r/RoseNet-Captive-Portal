<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Voucher Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <style>
        :root {
            --sidebar-bg: #1F2235;
            --main-bg: #F4F5F9;
            --accent-blue: #90CAF9;
            --card-bg: #FFFFFF;
            --text-dark: #2c3e50;
            --text-light: #ecf0f1;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--main-bg);
        }

        .sidebar {
            background-color: var(--sidebar-bg);
            color: var(--text-light);
        }

        .main-content {
            background-color: var(--main-bg);
        }

        .soft-card {
            background-color: var(--card-bg);
            border-radius: 1.5rem;
            box-shadow: var(--shadow);
            padding: 1.5rem;
        }

        .nav-item.active {
            background-color: var(--accent-blue);
            color: var(--sidebar-bg);
            border-radius: 0.75rem;
        }

        .nav-item {
            transition: all 0.2s ease-in-out;
        }

        .nav-item:hover {
            background-color: rgba(144, 202, 249, 0.2);
            border-radius: 0.75rem;
        }

        .system-status-card {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            border-radius: 1rem;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="flex h-screen">

    <!-- Login View -->
    <div id="loginView" class="w-full h-full flex items-center justify-center bg-gray-100">
        <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-lg text-center">
            <h1 class="text-3xl font-bold mb-6 text-gray-800">Admin Login</h1>
            <form id="loginForm" class="space-y-4">
                <input type="password" id="password" placeholder="Password"
                    class="w-full p-3 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400"
                    required>
                <button type="submit"
                    class="w-full p-3 font-bold rounded-md bg-blue-500 text-white hover:bg-blue-600 focus:outline-none">Login</button>
            </form>
            <p id="loginError" class="mt-4 text-red-500"></p>
        </div>
    </div>


    <!-- Admin Dashboard View -->
    <div id="adminView" class="hidden flex w-full">
        <!-- Sidebar -->
        <aside class="w-64 sidebar p-6 flex flex-col justify-between">
            <div>
                <h1 class="text-2xl font-bold mb-10">WiFi Admin</h1>
                <nav>
                    <ul>
                        <li class="mb-4"><a href="#dashboard"
                                class="nav-item active flex items-center p-3 rounded-lg"><i data-feather="grid"
                                    class="mr-3"></i>Dashboard</a></li>
                        <li class="mb-4"><a href="#vouchers"
                                class="nav-item flex items-center p-3 rounded-lg"><i data-feather="tag"
                                    class="mr-3"></i>Voucher Management</a></li>
                        <li class="mb-4"><a href="#sessions"
                                class="nav-item flex items-center p-3 rounded-lg"><i data-feather="activity"
                                    class="mr-3"></i>Active Sessions</a></li>
                        <li class="mb-4"><a href="#zones" class="nav-item flex items-center p-3 rounded-lg"><i
                                    data-feather="map-pin" class="mr-3"></i>Hotspot Zones</a></li>
                        <li class="mb-4"><a href="#logs" class="nav-item flex items-center p-3 rounded-lg"><i
                                    data-feather="file-text" class="mr-3"></i>User Logs</a></li>
                        <li class="mb-4"><a href="#reports" class="nav-item flex items-center p-3 rounded-lg"><i
                                    data-feather="bar-chart-2" class="mr-3"></i>Revenue Reports</a></li>
                    </ul>
                </nav>
            </div>
            <div>
                <div class="system-status-card p-4 text-center mb-4">
                    <p class="font-semibold">Server Online</p>
                </div>
                <a href="#" class="nav-item flex items-center p-3"><i data-feather="settings"
                        class="mr-3"></i>Settings</a>
                <a href="#" id="logoutButton" class="nav-item flex items-center p-3"><i data-feather="log-out"
                        class="mr-3"></i>Logout</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 main-content p-10 overflow-y-auto">
            <div id="page-content">
                <!-- Content will be injected here by JS -->
            </div>
        </main>

    </div>

    <!-- Templates for pages -->
    <template id="dashboard-template">
        <div class="fade-in">
            <!-- Header -->
            <header class="flex justify-between items-center mb-10">
                <div class="relative w-96">
                    <input type="text" placeholder="Search..."
                        class="w-full p-3 pl-10 rounded-full bg-white border-2 border-gray-200">
                    <i data-feather="search" class="absolute left-3 top-3 text-gray-400"></i>
                </div>
                <div class="flex items-center">
                    <i data-feather="bell" class="mr-6 text-gray-600"></i>
                    <img src="https://i.pravatar.cc/40" alt="User" class="w-10 h-10 rounded-full">
                </div>
            </header>

            <!-- Key Metrics -->
            <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 mb-10">
                <div class="soft-card">
                    <h3 class="text-gray-500">Total Revenue</h3>
                    <p id="total-revenue" class="text-4xl font-bold text-gray-800">$0</p>
                    <p class="text-green-500 mt-2">+15% this month</p>
                </div>
                <div class="soft-card">
                    <h3 class="text-gray-500">Active Vouchers</h3>
                    <p id="active-vouchers" class="text-4xl font-bold text-gray-800">0</p>
                    <i data-feather="check-circle" class="text-green-500 mt-2"></i>
                </div>
                <div class="soft-card">
                    <h3 class="text-gray-500">Total Data Consumed</h3>
                    <p id="total-data" class="text-4xl font-bold text-gray-800">0 GB</p>
                    <i data-feather="database" class="text-blue-500 mt-2"></i>
                </div>
                <div class="soft-card">
                    <h3 class="text-gray-500">Live Online Users</h3>
                    <p id="live-users" class="text-4xl font-bold text-gray-800">0</p>
                    <i data-feather="users" class="text-purple-500 mt-2"></i>
                </div>
            </section>

            <!-- Charts -->
            <section class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-10">
                <div class="soft-card lg:col-span-2">
                    <h3 class="font-bold text-lg mb-4">Voucher Sales Statistics</h3>
                    <canvas id="voucherSalesChart"></canvas>
                </div>
                <div class="soft-card">
                    <h3 class="font-bold text-lg mb-4">Voucher Status</h3>
                    <canvas id="voucherStatusChart"></canvas>
                </div>
            </section>

            <!-- Bottom Section -->
            <section class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="soft-card">
                    <h3 class="font-bold text-lg mb-4">Top Selling Plans</h3>
                    <ul>
                        <li class="flex justify-between items-center mb-3"><span>1 Hour Plan</span><span>502
                                sales</span></li>
                        <li class="flex justify-between items-center mb-3"><span>1 Day Plan</span><span>310
                                sales</span></li>
                        <li class="flex justify-between items-center"><span>Monthly Unlimited</span><span>120
                                sales</span></li>
                    </ul>
                </div>
                <div class="soft-card">
                    <h3 class="font-bold text-lg mb-4">Traffic by Zone</h3>
                    <canvas id="trafficByZoneChart"></canvas>
                </div>
            </section>
        </div>
    </template>

    <template id="vouchers-template">
        <div class="fade-in">
            <h1 class="text-3xl font-bold mb-8 text-gray-800">Voucher Management</h1>

            <!-- Add Voucher Form -->
            <div class="soft-card mb-8">
                <h2 class="text-2xl font-bold mb-4 text-gray-700">Add New Voucher</h2>
                <form id="addVoucherForm" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-4 items-end">
                    <div class="flex flex-col">
                        <label for="voucherName" class="text-sm font-medium text-gray-600 mb-1">Name</label>
                        <input type="text" id="voucherName" placeholder="e.g., 1-Day Pass"
                            class="p-2 rounded-md border">
                    </div>
                    <div class="flex flex-col">
                        <label for="code" class="text-sm font-medium text-gray-600 mb-1">Custom Code</label>
                        <input type="text" id="code" placeholder="Optional" class="p-2 rounded-md border">
                    </div>
                    <div class="flex flex-col">
                        <label for="price" class="text-sm font-medium text-gray-600 mb-1">Price</label>
                        <input type="number" id="price" placeholder="e.g., 5.00" class="p-2 rounded-md border">
                    </div>
                    <div class="flex flex-col">
                        <label for="duration" class="text-sm font-medium text-gray-600 mb-1">Duration</label>
                        <input type="number" id="duration" placeholder="e.g., 24" class="p-2 rounded-md border" required>
                    </div>
                    <div class="flex flex-col">
                        <label for="durationUnit" class="text-sm font-medium text-gray-600 mb-1">Unit</label>
                        <select id="durationUnit" class="p-2 rounded-md border bg-white">
                            <option value="minutes">Minutes</option>
                            <option value="hours">Hours</option>
                            <option value="days">Days</option>
                        </select>
                    </div>
                    <button type="submit"
                        class="p-2 font-bold rounded-md bg-blue-500 text-white hover:bg-blue-600 h-10">Add
                        Voucher</button>
                </form>
            </div>

            <!-- Voucher List -->
            <div>
                <h2 class="text-2xl font-bold mb-4 text-gray-700">Existing Vouchers</h2>
                <div class="soft-card overflow-x-auto">
                    <table class="min-w-full text-left">
                        <thead>
                            <tr class="border-b">
                                <th class="p-3">Name</th>
                                <th class="p-3">Code</th>
                                <th class="p-3">Price</th>
                                <th class="p-3">Duration</th>
                                <th class="p-3">Status</th>
                                <th class="p-3">Used By</th>
                                <th class="p-3">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="voucherList">
                            <!-- Vouchers will be dynamically inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </template>


    <script src="admin.js"></script>
    <script>
        feather.replace()
    </script>
</body>

</html>
